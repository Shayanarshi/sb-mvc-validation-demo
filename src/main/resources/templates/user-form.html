<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(30, 41, 59, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 15px;
            background: #e0e7ff;
            color: #4338ca;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 9px;
            color: #1e1b4b;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 21px;
        }

        label, legend {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #334155;
        }

        .required {
            color: #dc2626;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.13);
        }

        fieldset {
            border: none;
            margin: 0;
            padding: 0;
        }

        .gender-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .gender-option {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #cbd5e1;
            padding: 11px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: normal;
            margin: 0;
            flex: 1;
            justify-content: center;
        }

        .gender-option:has(input:checked) {
            border-color: #6366f1;
            background: #eef2ff;
            color: #4338ca;
        }

        .gender-option input {
            accent-color: #4f46e5;
        }

        .error {
            display: block;
            color: #dc2626;
            font-size: 13px;
            margin-top: 7px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <div class="icon" aria-hidden="true">&#128100;</div>
        <h1>Create Your Profile</h1>
        <p class="subtitle">
            Please fill in your details to complete registration.
        </p>
    </div>

    <form th:action="@{/register}" method="post" th:object="${user}">

        <div class="form-group">
            <label for="username">Full Name <span class="required">*</span></label>
            <input type="text" id="username" th:field="*{username}"
                   placeholder="Enter your full name" autocomplete="name"
                   required aria-describedby="username-error">
            <span class="error" id="username-error"
                  th:if="${#fields.hasErrors('username')}"
                  th:errors="*{username}"></span>
        </div>

        <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" th:field="*{email}"
                   placeholder="you@example.com" autocomplete="email"
                   required aria-describedby="email-error">
            <span class="error" id="email-error"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number <span class="required">*</span></label>
            <input type="text" id="mobile" th:field="*{mobile}"
                   placeholder="Enter 10-digit mobile number"
                   inputmode="numeric" maxlength="10" autocomplete="tel"
                   required aria-describedby="mobile-error">
            <span class="error" id="mobile-error"
                  th:if="${#fields.hasErrors('mobile')}"
                  th:errors="*{mobile}"></span>
        </div>

        <div class="form-group">
            <fieldset>
                <legend>Gender <span class="required">*</span></legend>
                <div class="gender-options">
                    <label class="gender-option">
                        <input type="radio" value="Male" th:field="*{gender}">
                        Male
                    </label>
                    <label class="gender-option">
                        <input type="radio" value="Female" th:field="*{gender}">
                        Female
                    </label>
                    <label class="gender-option">
                        <input type="radio" value="Other" th:field="*{gender}">
                        Other
                    </label>
                </div>
                <span class="error"
                      th:if="${#fields.hasErrors('gender')}"
                      th:errors="*{gender}"></span>
            </fieldset>
        </div>

        <div class="form-group">
            <label for="dateOfBirth">
                Date of Birth <span class="required">*</span>
            </label>
            <input type="date" id="dateOfBirth"
                   th:field="*{dateOfBirth}" required
                   aria-describedby="dob-error">
            <span class="error" id="dob-error"
                  th:if="${#fields.hasErrors('dateOfBirth')}"
                  th:errors="*{dateOfBirth}"></span>
        </div>

        <button type="submit" class="submit-btn">
            Register Now &#8594;
        </button>

    </form>


</div>
</body>
</html>
